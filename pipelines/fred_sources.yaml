  description: "Smoothed recession probability for the US from the Chauvet-Piger\ndynamic-factor Markov-switching model, combines nonfarm payrolls,\nindustrial production, real personal income (less transfers), and\nreal manufacturing/trade sales into a single latent-state estimate\nof whether the economy is in recession this month. Monthly,\npublished with about a 1-month lag.\n\nDistinct from:\n  - the NBER binary indicator (judgmental, declared months later)\n  - the NY Fed's yield-curve-derived probability (different model,\n    different underlying signal, not on FRED, see the New York\n    Fed's \"Probability of US recession\" web page)\n  - the SPF \"Anxious Index\" (a poll of forecasters)\n\nThis was previously labeled as the NY Fed yield-curve model, that\nwas wrong. RECPROUSM156N is Chauvet-Piger; the NY Fed yield-curve\nprobability isn't a single FRED series.\n"

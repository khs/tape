title: "Presidential election margin by county"
render: map
geo: county
indicator: pres_margin_county
vintage: "2024"
boundaryFile: /maps/us-counties-10m.json
colorScheme: rdbu
colorScale: diverging
blurb: |
  Margin in each county's presidential vote, Democratic minus Republican, in
  percentage points. Blue = Democratic, red = Republican, white = a tie. MIT
  Election Data and Science Lab county returns (public domain). Drag the year
  slider in the expanded view to scrub 2000 to 2024. The map uses pre-2022
  county boundaries (Connecticut's eight historical counties), matching how the
  returns are filed. Alaska is not shown at the county level because it reports
  results by state-house district rather than by borough.
tags: [elections, us]

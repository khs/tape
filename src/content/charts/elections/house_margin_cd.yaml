blurb: |
  Margin in each congressional district's US House election, Democratic minus
  Republican, in percentage points. Blue = Democratic, red = Republican, white =
  a tie; an uncontested seat pegs at the full color. Districts use the 118th
  Congress boundaries, so the year slider in the expanded view covers the two
  elections held on those lines, 2022 and 2024. MIT Election Data and Science
  Lab returns (public domain).

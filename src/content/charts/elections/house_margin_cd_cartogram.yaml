blurb: |
  Each congressional district's US House margin (Democratic minus Republican, in
  points), but every district is resized to its population rather than its land.
  Because districts are drawn to hold roughly equal population, they come out
  near equal-sized here, so a sprawling rural seat and a compact urban one carry
  the same visual weight. That strips away the land-area bias that makes the
  standard map look much redder than the actual House vote. 118th-Congress lines;
  drag the year slider in the expanded view for 2022 and 2024. MIT Election Data
  and Science Lab returns (public domain).

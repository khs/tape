title: "Presidential margin by state, population-weighted"
render: map
geo: state
indicator: pres_margin
vintage: "2024"
colorScheme: rdbu
colorScale: diverging
cartogram: true
blurb: |
  The same state presidential margins (Democratic minus Republican, in points of
  the total vote), but each state is resized so its AREA matches its population
  rather than its land. Dense, populous states swell and large, empty states
  shrink, so the picture reflects where voters actually are instead of how much
  ground a party covers. Contiguous cartogram weighted by ACS population; the
  shapes stay connected. Drag the year slider in the expanded view to scrub
  every election from 1976 to 2024.
tags: [elections, us]

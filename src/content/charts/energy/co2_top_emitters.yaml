blurb: |
  Annual CO2 emissions for the five largest emitters, in million
  tonnes (Our World in Data). China overtook the US around 2006 and
  has kept climbing; US emissions have drifted down from their
  mid-2000s peak; India's are rising fast off a low base. Production-
  based accounting, emissions are attributed to where goods are
  made, not consumed.

blurb: |
  Global CO2 emissions split by fossil-fuel source, in million
  tonnes (Our World in Data). Coal is still the single largest
  contributor and the most volatile; gas has grown steadily as it
  displaced coal in some economies. The three sum to most of global
  fossil CO2 (cement and flaring make up the rest).

blurb: |
  Solid line: monthly-averaged spot price (NYMEX front-month). Dashed line: today's NYMEX forward curve — each future-month contract plotted at its delivery month, priced at its most-recent close. The curve is the market's current price expectation, not a Tape-generated forecast.

blurb: |
  Annual average temperature at the long-record airport station for
  five US metros, from NOAA. The vertical spread is the climate gap —
  Miami and Phoenix sit ~30°F above Minneapolis — and the gentle
  upward drift in each line over 75 years is the warming trend.

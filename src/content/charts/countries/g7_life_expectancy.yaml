blurb: |
  Life expectancy at birth (both sexes), annual, from OECD Health
  Statistics. The US stands out as the persistent G7 underperformer
  even though it spends ~17% of GDP on healthcare (about double the
  G7 average).
  <br/><br/>
  Pair this with the "G7 health spending (% of GDP)" chart in the
  composer to see the spending-vs-outcome divergence visually.

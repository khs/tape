blurb: |
  Headline consumer price inflation (year-over-year) for G7 economies,
  harmonized methodology from OECD. Useful for spotting whether an
  inflation episode is global (2022 spike across all seven) or local
  (Japan running near zero while everyone else struggled with prices
  in the 2010s).

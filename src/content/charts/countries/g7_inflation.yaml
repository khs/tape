title: Inflation across major economies
# Japan (oecd/jpn_cpi_yoy) temporarily removed (2026-06-13): its OECD
# fetch is frozen at 2021, which dragged a dead line across the chart.
# Re-add it and restore the "G7 inflation" title once the OECD Japan CPI
# pipeline is repaired (see the note in that source's YAML).
sources:
  - "oecd/usa_cpi_yoy"
  - "oecd/can_cpi_yoy"
  - "oecd/gbr_cpi_yoy"
  - "oecd/fra_cpi_yoy"
  - "oecd/deu_cpi_yoy"
  - "oecd/ita_cpi_yoy"
render: line
defaultDelta: 10y
tags: [world, macro]
normalize: raw
blurb: |
  Headline consumer price inflation (year-over-year) for major advanced
  economies, harmonized methodology from OECD. Useful for spotting
  whether an inflation episode is global (the 2022 spike hit all of them
  at once) or local to one country.

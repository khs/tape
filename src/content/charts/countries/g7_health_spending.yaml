blurb: |
  Total current expenditure on health as a share of GDP, OECD System
  of Health Accounts methodology. Comparable across countries because
  it includes all financing schemes (public + private + mandatory
  social insurance).

  US spends ~17% of GDP on healthcare — roughly double the rate of
  Italy, the UK, or Japan — without commensurately better life
  expectancy outcomes.

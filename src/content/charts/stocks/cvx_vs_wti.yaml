blurb: |
  CVX and WTI crude, rebased to 100 at the window start. Like XOM, the
  integrated-major business model means cash flow scales roughly with
  crude. Diverging trajectories (CVX up while WTI flat, or vice versa)
  point at company-specific drivers, buyback pacing, Permian production
  guidance, downstream margins, rather than the commodity itself.

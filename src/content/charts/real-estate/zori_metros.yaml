blurb: |
  Typical observed market-rate rent (ZORI) for the US national
  series and the twelve largest metros. Zillow's repeat-rent index,
  weighted to the rental housing stock so it's representative of
  market-rate inventory. Monthly back to January 2015.

  Important context: ZORI tracks NEW leases at market rates. CPI
  Shelter tracks CONTRACT rent (including renewals) with a slow-
  rolling weight, so ZORI moves about a year before CPI does. The
  "rents have stopped going up" headlines in 2024-25 were ZORI
  flattening; the 2025-26 cooldown in core CPI was that ZORI move
  finally rolling into the official inflation measure.

title: Rent + shelter CPI
sources:
  - "fred/cpi_rent"
  - "fred/cpi_shelter"
render: line
defaultDelta: 10y
tags: [us, macro, real-estate]
normalize: rebase
blurb: |
  Rent of primary residence and shelter components of CPI, rebased so
  trajectories are comparable. Shelter is the broader bucket (rent +
  owners' equivalent rent + lodging away from home); rent is the narrower
  one.
  <br/><br/>
  CPI rent lags market rents by ~12 months because of how BLS samples
  existing leases. That lag is why headline CPI inflation stayed
  elevated through 2023–24 even after asking rents had peaked in late 2022.

title: DC-metro vs US home prices (Case-Shiller)
sources:
  - "fred/dc_case_shiller"
  - "fred/case_shiller"
render: line
defaultDelta: 30y
tags: [us, real-estate]
normalize: rebase
seriesLabels: ["DC-metro", "US national"]
blurb: |
  Case-Shiller home price indices, DC-metro and national, rebased so
  trajectories are directly comparable. DC-metro prices outpaced the
  national index during the 2010s federal-spending recovery, then
  matched the national pattern during the 2020–22 housing surge.
  <br/><br/>
  Pair this with the median-listing-price chart for the level read —
  the index here is trajectory only.

op: diff
render: line
defaultDelta: 10y
tags: [us, macro, derived, spread, rates, real-estate]
shading: [recessions]
blurb: |
  The premium the average homebuyer pays over the matched-maturity
  risk-free rate, computed on the fly as the 30-year fixed mortgage
  rate minus the 10-year US Treasury yield. Historically averages
  around 1.7–2.0 percentage points; it widened to over 3pp during
  the 2008 GFC and again during the 2022–23 mortgage-bond stress.

  When this spread is wide, mortgage credit is more expensive than
  the rate environment would suggest, usually because investors
  are demanding more risk premium, or because the MBS market has
  liquidity issues. Useful housing-market context that the headline
  30Y mortgage rate alone doesn't capture.

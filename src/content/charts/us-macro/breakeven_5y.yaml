title: 5-year breakeven inflation
sources:
  - fred/us_5y
  - fred/tips_5y
op: diff
render: line
defaultDelta: 1y
tags: [us, macro, derived, spread, rates, inflation]
blurb: |
  The bond market's pricing of expected average inflation over the
  next five years. Shorter-horizon counterpart to the 10-year
  breakeven; tends to move more on near-term oil + supply shocks
  while the 10-year averages those out.

  Computed on the fly as the spread between the 5-year nominal
  Treasury yield and the 5-year TIPS (real) yield, equivalent to
  FRED's T5YIE series. Built from the constituents so users can
  click through to either curve directly.

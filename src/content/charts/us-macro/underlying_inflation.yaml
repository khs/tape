title: Underlying inflation: sticky vs. median
sources:
  - fred/sticky_cpi
  - fred/median_cpi
render: line
defaultDelta: 10y
seriesLabels: ["Sticky-price CPI (YoY)", "Median CPI (annualized)"]
tags: [us, macro, inflation]
blurb: |
  Two regional-Fed measures that strip the noise out of headline
  inflation. The Atlanta Fed's sticky-price CPI tracks only prices
  that change infrequently (rent, services), they signal where
  inflation is heading, not where it's been. The Cleveland Fed's
  median CPI takes the middle of the monthly price-change
  distribution, ignoring outliers in either direction. When both run
  hot, the inflation is broad-based rather than a few volatile
  categories.

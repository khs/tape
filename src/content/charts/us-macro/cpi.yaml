title: CPI (headline)
sources: ["fred/us_cpi"]
render: line
defaultDelta: 5y
tags: [us, macro, inflation]
# The CPI index alone reads as a featureless climb; YoY default
# surfaces the inflation rate that headline news actually tracks.
transform: yoy_pct
shading: [recessions]
annotations:
  - date: "1979-08-06"
    label: Volcker era starts
  - date: "1982-12-01"
    label: Volcker disinflation
    position: below
  - date: "2008-09-15"
    label: GFC
  - date: "2022-06-01"
    label: Inflation peak 9.1%
blurb: |
  **Headline CPI** tracks a typical urban household's basket of
  goods and services. **Core CPI** strips out food and energy, 
  they bounce on short-term shocks (weather, OPEC, harvests) and obscure
  underlying inflation pressure.

  **PCE** (Personal Consumption Expenditures) is the Fed's
  preferred inflation gauge. Different basket from CPI, and it lets that
  basket shift as consumers substitute toward cheaper goods, so PCE
  usually runs ~0.3 pp below CPI. **Headline vs Core PCE**
  follows the same with/without-food-and-energy distinction.

title: CPI (headline)
sources: ["fred/us_cpi"]
render: line
defaultDelta: 1y
tags: [us, macro]
blurb: |
  <strong>Headline CPI</strong> tracks a typical urban household's basket of
  goods and services. <strong>Core CPI</strong> strips out food and energy —
  they bounce on short-term shocks (weather, OPEC, harvests) and obscure
  underlying inflation pressure.
  <br/><br/>
  <strong>PCE</strong> (Personal Consumption Expenditures) is the Fed's
  preferred inflation gauge. Different basket from CPI, and it lets that
  basket shift as consumers substitute toward cheaper goods — so PCE
  usually runs ~0.3&nbsp;pp below CPI. <strong>Headline vs Core PCE</strong>
  follows the same with/without-food-and-energy distinction.

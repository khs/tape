title: Case-Shiller home prices
sources: ["fred/case_shiller"]
render: line
defaultDelta: 5y
tags: [us, macro, real-estate]
# The Case-Shiller index level alone is hard to interpret — readers
# almost always want the YoY growth rate. Default the dialog plot to
# YoY %; the pill row lets a viewer flip back to Level if they want
# to see the index itself.
transform: yoy_pct
shading: [recessions]
blurb: |
  Case-Shiller US national home-price index. The YoY % change is
  the headline reading most people care about; the index level
  itself climbs to ~325 today (base 100 = January 2000) but the
  rate of change is what the Fed and the housing-market commentary
  track.

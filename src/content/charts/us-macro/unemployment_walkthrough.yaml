title: US unemployment rate
# Walkthrough variant of us-macro/unemployment. Same single source +
# render, but ships with a `blurb` that the dashboard surfaces in the
# expanded-tile dialog — the walkthrough page tells the reader to
# click this tile to see what a chart-level description looks like.
# Pure curated curiosity; if you need the indicator on a real
# dashboard, prefer us-macro/unemployment so editorial-blurb edits
# made for the walkthrough don't bleed into production tiles.
sources: ["fred/us_unemployment"]
render: line
defaultDelta: 1y
tags: [us, macro]
blurb: |
  This is what a chart's custom description looks like: each
  chart can carry its own prose visible to anyone who clicks the
  tile to expand it. Useful spot for the basic information about
  the data source plus a link to the underlying provider.

  This series is the headline US civilian unemployment rate
  (seasonally adjusted), published monthly by the Bureau of Labor
  Statistics. Source: [FRED's UNRATE page](https://fred.stlouisfed.org/series/UNRATE).
  You can switch which timeframe you're looking at within a given
  chart. Zoom out to Max to see just how bad COVID was.

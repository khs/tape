blurb: |
  Output per hour worked, two sectors:

  - **Nonfarm business**: the headline productivity number, covering ~80% of the private economy.
  - **Manufacturing**: the cyclical, technology-sensitive sector that drives a lot of the wage-vs-productivity argument.

  Productivity growth is the only sustainable source of real wage
  growth. The post-2007 slowdown ("the missing decade") and the
  2023-24 rebound are central to current macro debates.

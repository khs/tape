title: Real disposable personal income
sources: ["fred/real_disposable_income"]
render: line
defaultDelta: 5y
tags: [us, macro, consumer]
blurb: |
  After-tax personal income, adjusted for inflation. The income
  foundation underneath consumer-confidence readings, when real
  disposable income is rising, sentiment tends to follow; when it
  stalls or falls, sentiment leads it down.

  One of three consumer-mood proxies we surface (alongside the JOLTS
  quits rate and total consumer credit) since the headline UMich
  consumer-sentiment series is third-party copyrighted and not
  redistributable. None of these three is a perfect substitute for
  sentiment, but reading them together gives most of the signal.

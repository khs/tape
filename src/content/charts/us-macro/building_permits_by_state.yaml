blurb: |
  New privately-owned housing units authorized by building permits,
  monthly, for the four largest states, a leading indicator of where
  residential construction is headed. From the Census Bureau's
  Building Permits Survey (via FRED). Texas and Florida have pulled
  well ahead of California and New York over the past decade.

blurb: |
  Outstanding consumer credit and its two components, from the
  Federal Reserve's G.19 release. Revolving credit is mostly credit
  cards; nonrevolving is dominated by auto and student loans. The two
  components sum to the total, nonrevolving has pulled far ahead
  since the late 2000s as student debt climbed.

blurb: |
  Monthly business applications filed with the IRS, seasonally
  adjusted, the Census Bureau's Business Formation Statistics, via
  FRED. A high-frequency read on entrepreneurship that jumped to a
  durably higher level after mid-2020 and hasn't come back down. Swap
  in any state's series from the composer to see the local picture.

title: HY–IG credit risk premium
sources:
  - fred/hy_spread
  - fred/ig_spread
op: diff
render: line
defaultDelta: 10y
tags: [us, macro, derived, spread, credit]
shading: [recessions]
blurb: |
  The premium investors demand for high-yield corporate debt over
  investment-grade — ICE BofA HY OAS minus IG OAS. Strips out the
  movements common to both (risk-free rate, broad credit cycle)
  and isolates the "stretching for yield" premium.
  <br/><br/>
  Compresses when investors are comfortable holding lower-quality
  credit (search-for-yield environments, 2017, 2021); widens during
  risk-off episodes when HY blows out faster than IG (2008, 2020
  COVID, 2022). A cleaner stress gauge than either OAS series in
  isolation — both spreads move together in level terms, but the
  spread of spreads is what signals genuine credit-risk repricing.

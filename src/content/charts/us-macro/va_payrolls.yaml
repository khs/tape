blurb: |
  Total nonfarm payroll employment in Virginia, BLS CES, seasonally
  adjusted, in thousands. Virginia's employment base is ~50% federal +
  state government, federal contractors, and federally-dependent
  services in NoVA, substantially less cyclical than e.g. Michigan
  (manufacturing) or Nevada (hospitality).

title: NVIDIA relative to its sector (NVDA ÷ SMH)
sources:
  - yahoo/nvda
  - yahoo/smh
op: divide
percentDisplay: decimal
render: line
defaultDelta: 5y
tags: [single-name, tech, equity-index, us, derived, ratio]
blurb: |
  How many shares of the broad semiconductor ETF (SMH) one share of
  NVDA is worth, over time. A pure relative-strength chart — when the
  line is rising, NVDA is outperforming the rest of the chip sector;
  flat means it's tracking the sector; falling means it's lagging.
  <br/><br/>
  Both sides are daily adjusted close prices. NVDA's run from
  early-2023 through 2024 shows up here as a near-vertical ascent —
  the entire AI-GPU regime change in one ratio. SMH includes NVDA
  (it's the largest holding), so the ratio understates NVDA's
  outperformance against the rest of the sector by the fraction SMH
  itself moves with NVDA.

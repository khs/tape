blurb: "Total covered employment in the District of Columbia against the slice that is direct federal-government employment, from the BLS Quarterly Census of Employment and Wages. Federal agencies account for roughly a quarter of DC's covered jobs, about 193,000 of 760,000 in 2024; the private sector and local government are the rest. Federal employment by jurisdiction across the metro is available in the composer (Arlington and Montgomery counties carry the next-largest federal shares)."

blurb: "Total-compensation cost growth across the three ownership groups the Employment Cost Index covers: all civilian workers (the headline), private industry, and state and local government. Federal workers are outside the ECI. State and local government compensation has tended to rise a little faster than private over this span. Quarterly, seasonally adjusted, index Dec 2005 = 100."

blurb: "Covered employment (jobs covered by unemployment insurance, about 95 percent of the total) by jurisdiction across the Washington DC metro area, from the BLS Quarterly Census of Employment and Wages. DC has the largest single-jurisdiction job base, about 760,000, followed by Fairfax County at about 636,000. The full metro and other jurisdictions are available in the composer."

blurb: "The Employment Cost Index tracks what employers pay per hour worked, holding the mix of jobs fixed so it is not skewed by shifts between high- and low-wage work. Splitting civilian compensation into wages-and-salaries versus benefits (health insurance, retirement, paid leave) shows benefit costs rising faster than wages over most of this period. Quarterly, seasonally adjusted, index Dec 2005 = 100. Apply the year-over-year transform to read it as the wage-growth rate the Fed watches."

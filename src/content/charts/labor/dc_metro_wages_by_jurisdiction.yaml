blurb: "Average weekly wage across all covered employment by jurisdiction in the Washington DC metro area, from the BLS Quarterly Census of Employment and Wages. DC and Arlington County post the highest wages, about $2,360 a week in 2024, reflecting their concentration of federal and professional jobs; Prince William County is the lowest of these jurisdictions. Wage is total payroll divided by employment, so it moves with both pay rates and job mix."

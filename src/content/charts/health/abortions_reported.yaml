blurb: |
  Total abortions in the United States. From the Guttmacher Institute Abortion
  Provider Census (all known providers, all 50 states and DC) for 1973 to 2020,
  spliced with the Guttmacher Monthly Abortion Provision Study for 2023 to 2025.
  The count topped 1.6 million around 1990, fell to about 930,000 by 2020, then
  rose past 1.1 million after the 2022 Dobbs decision. Both series count
  nationally, unlike CDC surveillance, which excludes California and others. The
  2020-to-2023 break marks the census-to-monthly-study change; 2021 and 2022 are
  not covered.

blurb: |
  Provisional count of US drug overdose deaths over the trailing 12 months,
  reported monthly. CDC National Center for Health Statistics, Vital Statistics
  Rapid Release. Each point is a rolling-year total, using CDC's
  completeness-adjusted estimate. Deaths surged through the synthetic-opioid
  wave to a peak above 110,000 in 2022 to 2023, then fell sharply. Because
  recent months are still being finalized, the latest values may be revised.

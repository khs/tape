blurb: |
  Abortions per 1,000 women aged 15 to 44 in the United States. From the
  Guttmacher Institute Abortion Provider Census for 1973 to 2020, spliced with
  the Guttmacher Monthly Abortion Provision Study for 2023 to 2025. The rate
  peaked near 29 around 1980, fell to about 14 by the late 2010s, then rose after
  the 2022 Dobbs decision to 16.7 by 2024. Both series count nationally, unlike
  CDC surveillance, which excludes California and others. The 2020-to-2023 break
  marks the census-to-monthly-study change; 2021 and 2022 are not covered.

annotations:
  - date: "2022-01-01"
    label: "Census ends, monthly study begins"
blurb: |
  Abortions per 1,000 live births in the United States. From the Guttmacher
  Institute Abortion Provider Census (all 50 states and DC) for 1973 to 2020,
  then computed from Guttmacher Monthly Abortion Provision Study abortions and
  CDC NCHS live births for 2023 and 2024. Because Guttmacher counts nationally,
  unlike CDC abortion surveillance, which excludes California and others, the
  ratio runs well above the CDC figure. The 2020-to-2023 break marks a change
  from the triennial census to the monthly study; part of the step up reflects
  the study's wider coverage, including telehealth abortions under shield laws,
  not only a real increase. 2021 and 2022 are not covered, and the 2025 ratio
  awaits final birth totals.

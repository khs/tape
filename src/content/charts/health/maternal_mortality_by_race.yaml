blurb: |
  Maternal deaths per 100,000 live births in the United States by race and
  ethnicity, by year. CDC National Center for Health Statistics. Black women's
  rate has run roughly three times the White rate across this period and peaked
  near 70 in 2021. Figures use the post-2018 pregnancy-checkbox coding and are
  not comparable to maternal mortality reported before 2018.

blurb: |
  Block-group-level median household income across VA-08, ACS
  5-year ending 2022. Darker = higher income. Pulls apart the
  "VA-08 = uniformly high income" tract-level story into actual
  pockets: high-rise apartment-dense block groups along the
  Metro Orange line read lower; single-family neighborhoods
  in McLean / Falls Church anchor the top.

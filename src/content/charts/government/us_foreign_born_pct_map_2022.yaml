blurb: |
  Foreign-born population as a share of each state's total population,
  ACS 5-year ending 2022. Darker = larger foreign-born share. California,
  New York, New Jersey, and Florida are the most foreign-born; West
  Virginia, Mississippi, and the northern plains the least. National
  share is ~13.9%; VA-08 individually clocks ~27% — about double
  Virginia overall.

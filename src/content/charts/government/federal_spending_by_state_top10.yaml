blurb: |
  Top 10 states by total federal spending (contracts + grants + loans
  + direct payments), fiscal year, from USAspending.gov. Virginia
  consistently tops the list because of DoD contractor concentration
  in the DMV; Maryland follows for similar reasons. California is #3
  by sheer population scale.

  All 50 states + DC + territories available in the composer for
  custom subsetting.

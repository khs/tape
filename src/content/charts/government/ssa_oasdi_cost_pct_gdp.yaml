blurb: |
  Solid line: historical OASDI cost / GDP. Dashed line: 75-year intermediate-cost projection from the most recent SSA Trustees Report. "OASDI" = Old-Age, Survivors, and Disability Insurance, Social Security in aggregate. The Trustees Report also publishes low-cost and high-cost alternatives bracketing this central estimate.

blurb: |
  Solid line: historical debt held by the public / GDP from CBO. Dashed line: 10-year baseline projection. "Held by the public" excludes intra-governmental Treasury holdings of trust funds like Social Security. The projection's trajectory is sensitive to assumed interest rates and to whether expiring tax provisions get extended.

render: line
defaultDelta: 10y
tags: [us, government]
normalize: rebase
blurb: |
  Federal spending across the DC-metro congressional districts, rebased
  to 100 at window start so growth trajectories are comparable. Raw
  levels differ severalfold (VA-11 ~$80B, DC ~$40B, VA-08 ~$35B, MD-08
  ~$12B, MD-05 ~$6B) so side-by-side rebase tells a clearer story
  than absolute dollars.

  VA-11 (outer Fairfax) has grown fastest as data-center and contractor
  build-out spread west. MD districts grew slower as Bethesda/NIH
  spending stabilized; DC's growth was middle-of-pack despite being
  the seat of government, because most of its federal flow is salaries
  rather than the kind of contract money that's grown fastest.

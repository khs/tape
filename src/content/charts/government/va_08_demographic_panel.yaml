title: "VA-08 demographics: population, education, foreign-born, owner-occupied"
sources:
  - "acs_cd/population_va_08"
  - "acs_cd/bachelors_plus_va_08"
  - "acs_cd/foreign_born_va_08"
  - "acs_cd/owner_occupied_va_08"
render: line
defaultDelta: 10y
tags: [us, government]
normalize: rebase
seriesLabels: ["Total population", "Adults with bachelor's", "Foreign-born", "Owner-occupied units"]
blurb: |
  Four count-based demographic measures for VA-08, rebased to 100 at
  window start so trajectories are directly comparable. All four are
  aggregated from tract-level ACS data on stable 118th-Congress
  geography.

  Population is roughly flat (the district is built out), so the
  growth in bachelor's-degree-holders and foreign-born population is
  composition change, the district is getting more highly-educated
  and more international, not just bigger. Owner-occupied unit growth
  is the slowest line, reflecting how much of the district's housing
  stock is dense rental rather than single-family ownership.

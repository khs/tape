title: US House campaign spending per cycle
sources:
  - fec/house_spending_us_total
render: line
defaultDelta: 30y
emphasis: change
tags: [elections, us, macro]
blurb: |
  Total campaign disbursements by all U.S. House candidates nationwide,
  summed per two-year election cycle, from the Federal Election
  Commission. The long climb is the story, money in House races has
  risen steeply cycle over cycle. Each point is one election cycle (a
  two-year cadence), so the line tracks elections rather than wobbling
  with the calendar. Per-district series are available in the composer
  (search "House campaign spending"), sum, compare, or pull a single
  seat.

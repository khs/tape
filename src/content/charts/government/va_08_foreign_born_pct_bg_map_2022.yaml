blurb: |
  Block-group-level foreign-born share across VA-08, ACS 5-year
  ending 2022. Darker = larger foreign-born share. Bailey's
  Crossroads and the Route 7 / Columbia Pike corridors top 60% in
  several block groups — among the most foreign-born places in the
  country. North Arlington runs in the teens by contrast.

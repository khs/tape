blurb: |
  Share of each state's population below the federal poverty line, ACS
  5-year ending 2022. Darker = higher poverty rate. The South + parts
  of the Southwest run consistently higher than the Northeast +
  Pacific. VA, MD, and DC-suburbs are near the low end thanks to
  federal-employee + tech-corridor wage premiums.

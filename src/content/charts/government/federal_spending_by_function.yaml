blurb: |
  Six biggest federal spending categories, quarterly annualized rates.
  Three entitlements (Social Security, Medicare, Medicaid), defense,
  nondefense discretionary, and net interest.

  Interest has crossed defense spending in 2024, the first time in
  the post-WWII era, as the Treasury rolls debt at post-ZIRP rates.

  To see these as share-of-GDP, use "Open as new dashboard," add the
  ÷ GDP derived sources, and compose them back in.

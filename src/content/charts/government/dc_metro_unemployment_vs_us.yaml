title: DC-metro unemployment vs US
sources:
  - "fred/dc_unemployment_rate"
  - "fred/us_unemployment"
render: line
defaultDelta: 30y
tags: [us, labor]
normalize: raw
seriesLabels: ["DC-metro", "US national"]
blurb: |
  Unemployment rate for the Washington-Arlington-Alexandria MSA vs the
  US national rate, monthly. The DC-metro line is BLS LAUS for the
  full MSA (which crosses DC, parts of VA, MD, and WV). The gap
  between the two lines is the federal-economy resilience premium, 
  the DC metro reliably runs 1–2 percentage points below the national
  rate, and that gap widens during recessions because federal-employee
  jobs aren't cyclical.

blurb: |
  Share of adults 18+ with a bachelor's degree or higher, ACS 5-year
  ending 2022. Darker = higher education attainment. The denominator
  here is 18+ (a proxy for the canonical 25+ universe) — the relative
  ordering between states is preserved; absolute values run a few
  percentage points lower than the standard 25+ figure. DC, MA, MD,
  and CO lead; WV, MS, and KY anchor the bottom.

title: Poverty rate by US state, population-weighted (2022)
render: map
geo: state
indicator: poverty_rate
vintage: "2022"
colorScheme: reds
colorScale: linear
cartogram: true
tags: [government, us, demographics, poverty]
blurb: |
  Share of each state's population below the federal poverty line (ACS 5-year
  ending 2022), drawn on a population cartogram: each state's area is scaled to
  its population, not its land area. This keeps small, crowded states readable
  and stops the empty Mountain West from visually dominating. Darker = higher
  poverty rate. Read it alongside the standard land-area map to see how much the
  geography of poverty shifts once you weight by people.

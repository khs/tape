blurb: |
  Median household income trajectories for the DC-metro
  congressional districts. All on stable 118th-Congress geography,
  recomputed from B19001 distribution tables aggregated by tract.
  <br/><br/>
  VA-10 (Loudoun and outer Fairfax) tops the metro at $150k+
  median, reflecting the data-center-corridor wealth concentration.
  VA-08 (Arlington / Alexandria / Falls Church) and VA-11 (outer
  Fairfax) sit in the $125–135k range. Maryland's MD-05 and MD-08
  are slightly lower, in the $118–126k band.
  <br/><br/>
  All five grew nominal income 21–28% over five years; ranking has
  stayed largely stable.

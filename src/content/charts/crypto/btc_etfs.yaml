blurb: |
  TradFi vehicles for Bitcoin exposure. IBIT and FBTC are the two
  biggest spot Bitcoin ETFs (launched Jan 2024). MARA and RIOT are
  the two largest publicly-traded Bitcoin miners — their stock prices
  amplify BTC's moves with mining-economics leverage.

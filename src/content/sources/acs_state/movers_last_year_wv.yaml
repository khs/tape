name: People who moved in the last year — WV
shortName: WV movers (last yr)
description: People who moved in the last year for WV (statewide). Aggregated from the 3 congressional-district series for this state (118th-Congress boundaries) via direct sum. Underlying source, American Community Survey 5-year estimates (table B07003), released annually.
kind: timeseries
pipeline: derive_acs_state_from_cd
dataFile: data/acs_state/movers_last_year_wv.json
supportedDeltas: ["5y", "10y"]
unit: people
formatting:
  style: number
  decimals: 0
  notation: compact
emphasis: change
provenance:
  provider: US Census Bureau (ACS 5-year)
  series: movers_last_year_state
  url: https://api.census.gov/data/2022/acs/acs5
  license: Public domain (US government data)
tags:
  - government
  - us
unitClass: count

name: Corn — spot history + futures curve
shortName: Corn curve
description: |
  CBOT corn front-month spot history + today's NYMEX forward curve. Corn is the largest US crop by acreage and one of the top US ag exports by value. Contracts deliver Mar / May / Jul / Sep / Dec — the gaps reflect the planting-and-harvest calendar (new-crop Dec contracts trade at a different level than the prior crop year's contracts). Quoted in US cents per bushel.
kind: timeseries

name: VIX volatility — spot history + futures curve
shortName: VIX curve
description: |
  The CBOE Volatility Index ("VIX") — the market's pricing of S&P 500 implied volatility over the next 30 days, derived from SPX options. Solid line is monthly-averaged spot ^VIX; dashed extension is the front-vs-second-month VIX-futures spread (Cboe rolling indices ^VFTW1 and ^VFTW2). When the curve slopes UP (contango) the market is calm; when it slopes DOWN (backwardation) traders pay a premium for immediate volatility protection — a crisis indicator.
kind: timeseries
pipeline: yahoo_futures
dataFile: data/yahoo_futures/vix_curve.json
supportedDeltas: ["1m", "ytd", "1y", "5y", "10y"]
unit: index
formatting:
  style: number
  decimals: 2
provenance:
  provider: Yahoo Finance
  series: ^VIX (spot) + ^VFTW1 / ^VFTW2 (Cboe 1st/2nd-month rolling indices)
  url: https://finance.yahoo.com/quote/%5EVIX
  notes: |
    Yahoo's free-tier futures coverage doesn't include individual VIX contract symbols (e.g., VXK26.CFE), so the "curve" is just two points — the front-month and 2nd-month continuous-rolling Cboe indices. That's enough to convey the contango/backwardation signal, which is the headline anyway.

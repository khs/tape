name: VIX volatility — spot history + futures curve
shortName: VIX curve
description: |
  The CBOE Volatility Index (VIX): the market's implied expectation of S&P 500 volatility over the next 30 days, derived from SPX options prices. Solid line is monthly-averaged spot ^VIX; dashed extension is the current CBOE VIX futures curve (front-month + 2nd-month). The slope is the headline read — contango (upward, calm regime) vs backwardation (downward, crisis premium for near-term protection).
kind: timeseries
pipeline: yahoo_futures
dataFile: data/yahoo_futures/vix_curve.json
supportedDeltas: ["1m", "ytd", "1y", "5y", "10y"]
unit: index
formatting:
  style: number
  decimals: 2
emphasis: change
provenance:
  provider: Yahoo Finance
  series: ^VIX + ^VFTW1 / ^VFTW2 (rolling continuous VIX futures)
  url: https://finance.yahoo.com/quote/%5EVIX
  notes: |
    Sourced from Yahoo Finance, not Cboe directly. Our chain of custody is Cboe → Yahoo → us, so the redistribution terms that bind us are Yahoo's (the same gray-zone non-commercial-research norm we accept for all yahoo_marketcap + yahoo_futures data). Pulling VIX directly from cdn.cboe.com would be a clearer Cboe-ToS violation and is not part of any pipeline here.

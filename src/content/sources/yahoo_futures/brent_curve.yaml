name: Brent crude oil — spot history + futures curve
shortName: Brent curve
description: |
  Brent crude (North Sea) — the global oil benchmark, priced off about two-thirds of internationally traded crude. The solid line is monthly-averaged spot front-month price; the dashed extension is the current forward curve out ~18 months, each contract plotted at its delivery month with its most-recent close.

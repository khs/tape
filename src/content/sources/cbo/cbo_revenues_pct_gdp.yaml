name: Federal revenues as % of GDP — CBO baseline
shortName: CBO revenues / GDP
description: |
  Total federal revenues as a percentage of GDP. Historical values come from CBO's Historical Budget Data; the dashed extension is the 10-year baseline projection from the most recent CBO Budget & Economic Outlook.
kind: timeseries
pipeline: cbo
dataFile: data/cbo/cbo_revenues_pct_gdp.json
supportedDeltas: ["10y", "30y", "50y"]
unit: "% of GDP"
formatting:
  style: percent
  decimals: 1
provenance:
  provider: Congressional Budget Office
  series: Budget & Economic Outlook + Historical Budget Data
  url: https://www.cbo.gov/data/budget-economic-data
  license: Public domain (per cbo.gov copyright statement)
  notes: |
    Revenues / GDP have hovered near 17% for three quarters of a century — sometimes called "Hauser's Law." The CBO baseline holds existing tax-law parameters fixed, so the projected segment captures only mechanical revenue effects from projected GDP growth, not policy changes.
tags:
  - fiscal
  - government
  - macro
  - us
unitClass: rate

name: Quits rate (JOLTS)
shortName: Quits rate
description: "Number of voluntary quits as a percent of total employment. Commonly read as worker-confidence: high quits = workers feel safe job-hopping. Was a key signal during the post-COVID labor reshuffle."
kind: timeseries
pipeline: fred_series
dataFile: data/fred/JTSQUR.json
supportedDeltas: ["1y", "5y", "10y"]
unit: "%"
formatting:
  style: percent
  decimals: 1
emphasis: change
provenance:
  provider: FRED (St. Louis Fed)
  series: JTSQUR
  url: https://fred.stlouisfed.org/series/JTSQUR
  license: Public domain (US government data)

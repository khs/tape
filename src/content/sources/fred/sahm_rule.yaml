name: Sahm rule recession indicator (real-time)
shortName: Sahm rule
description: |
  Triggers a recession-indicator reading when the 3-month moving
  average of the U-3 unemployment rate rises 0.5pp above its
  trailing-12-month minimum. Devised by Claudia Sahm (2019). Monthly.

  This is the SAHMREALTIME variant, built from the unemployment data
  available at each publication date, with no later revisions. The
  SAHMCURRENT variant uses revised data.
kind: timeseries
pipeline: fred_series
dataFile: data/fred/SAHMREALTIME.json
supportedDeltas:
- 1y
- 5y
- 10y
- 30y
- 50y
unit: '%'
formatting:
  style: percent
  decimals: 2
emphasis: change
provenance:
  provider: FRED (St. Louis Fed)
  series: SAHMREALTIME
  url: https://fred.stlouisfed.org/series/SAHMREALTIME
  license: Public domain (US government data)
tags:
- macro
- labor
- us
unitClass: rate

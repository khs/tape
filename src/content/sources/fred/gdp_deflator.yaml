name: GDP price deflator
shortName: GDP deflator
description: GDP price deflator from the BEA's national accounts. Quarterly. The broadest measure of US economy-wide inflation, distinct from CPI (consumer basket) or PCE (consumer spending weights). Reads slightly differently because it covers everything produced, including investment goods and government services. (GDP = Gross Domestic Product.)
kind: timeseries
pipeline: fred_series
dataFile: data/fred/GDPDEF.json
supportedDeltas: ["1y", "5y", "10y", "30y", "50y"]
unit: "index (2017=100)"
formatting:
  style: index
  decimals: 2
emphasis: change
provenance:
  provider: FRED (St. Louis Fed)
  series: GDPDEF
  url: https://fred.stlouisfed.org/series/GDPDEF
  license: Public domain (US government data)
tags:

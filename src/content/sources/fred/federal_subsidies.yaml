description: |
  Federal government current expenditures on subsidies (direct
  payments to businesses and individuals to support specified
  activities), from BEA NIPA Table 3.2 line "Subsidies."
  Quarterly annualized rate, billions USD. Distinct from the
  much larger transfer-payment categories (Social Security,
  Medicare, Medicaid), captures targeted industrial policy +
  temporary support programs (PPP, etc.).

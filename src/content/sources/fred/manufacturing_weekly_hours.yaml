name: Average weekly hours, manufacturing
shortName: Mfg weekly hours
description: Average weekly hours worked by production and nonsupervisory employees in manufacturing, seasonally adjusted. Monthly. A classic leading indicator - when demand softens, hours per worker contract before headcount does, so this turns down 3-6 months ahead of the broader labor market.
kind: timeseries
pipeline: fred_series
dataFile: data/fred/AWHMAN.json
supportedDeltas: ["1y", "5y", "10y", "30y", "50y"]
unit: "hours"
formatting:
  style: number
  decimals: 1
emphasis: change
provenance:
  provider: FRED (St. Louis Fed)
  series: AWHMAN
  url: https://fred.stlouisfed.org/series/AWHMAN
  license: Public domain (US government data)
tags:
  - labor
  - macro
  - us
unitClass: ratio

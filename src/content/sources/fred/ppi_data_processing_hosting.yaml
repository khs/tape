name: PPI — Data processing, hosting & related services
shortName: PPI data hosting
description: Producer Price Index for data processing, hosting, and related services (NAICS 518210). The closest published-price index to wholesale cloud-and-hosting pricing. Lags spot but tracks the secular price trend (long-run down from cloud scale, but recently bottoming as AI-compute demand chases finite supply). Monthly from BLS via FRED.

name: JOLTS quits rate
shortName: Quits rate
description: Quits as a percent of total employment. The "great resignation"
  series — workers quit when they're confident enough in the labor market
  to bet they can find another job. Public-domain BLS data; one of the
  proxies for the UMich consumer-sentiment series (which we don't ingest,
  third-party copyright).
kind: timeseries
pipeline: fred_series
dataFile: data/fred/JTSQUR.json
supportedDeltas: ["1m", "ytd", "1y", "5y", "10y"]
unit: "%"
formatting:
  style: percent
  decimals: 1
provenance:
  provider: U.S. Bureau of Labor Statistics (BLS) via FRED
  series: JTSQUR
  url: https://fred.stlouisfed.org/series/JTSQUR
  license: Public domain (US government data; BLS Job Openings and Labor Turnover Survey)
tags:
  - macro
  - labor
  - sentiment-proxy
  - us
unitClass: rate

name: JOLTS quits rate
shortName: Quits rate
description: Quits as a percent of total employment. The "great resignation" series, workers quit when they're confident enough in the labor market to bet they can find another job. Public-domain BLS data. (JOLTS = Job Openings and Labor Turnover Survey.)

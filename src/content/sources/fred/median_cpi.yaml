name: Median CPI (annualized monthly)
shortName: Median CPI
description: The Cleveland Fed's median consumer price index (CPI), the one-month inflation rate of the item at the middle of the price-change distribution, annualized. Strips outsized moves in any single category to show core inflation's central tendency. Monthly, seasonally adjusted.

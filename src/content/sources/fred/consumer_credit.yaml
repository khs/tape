name: Total consumer credit (owned + securitized)
shortName: Consumer credit
description: Total consumer credit outstanding (revolving + non-revolving),
  owned and securitized. Rising borrowing signals consumer confidence
  willing to take on debt; deceleration or contraction signals risk-off.
  Public-domain Federal Reserve data; one of the proxies for the UMich
  consumer-sentiment series (which we don't ingest, third-party copyright).
kind: timeseries
pipeline: fred_series
dataFile: data/fred/TOTALSL.json
supportedDeltas: ["1m", "ytd", "1y", "5y", "10y", "30y"]
unit: "billions USD"
formatting:
  style: currency
  decimals: 0
  notation: compact
  scaleFactor: 1000000000
provenance:
  provider: Board of Governors of the Federal Reserve System via FRED
  series: TOTALSL
  url: https://fred.stlouisfed.org/series/TOTALSL
  license: Public domain (US government data; FRB G.19 Consumer Credit release)
tags:
  - macro
  - consumer
  - sentiment-proxy
  - us
unitClass: currency

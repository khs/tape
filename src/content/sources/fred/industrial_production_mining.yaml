name: Industrial production — Mining
shortName: IP mining
description: Industrial production index for mining (NAICS 21), including oil & gas extraction. Pair with IPMAN (manufacturing) and IPUTIL (utilities) for the three-sector view of US industrial output, these often diverge sharply (e.g. utilities up on AI demand while mining swings on oil prices). Monthly from Fed via FRED.
kind: timeseries
pipeline: fred_series
dataFile: data/fred/IPMINE.json
supportedDeltas:
- 1y
- 5y
- 10y
- 30y
- 50y
unit: index (2017=100)
formatting:
  style: index
  decimals: 2
emphasis: change
provenance:
  provider: FRED (St. Louis Fed)
  series: IPMINE
  url: https://fred.stlouisfed.org/series/IPMINE
  license: Public domain (US government data)
tags:
- macro
- us
- commodities
unitClass: index

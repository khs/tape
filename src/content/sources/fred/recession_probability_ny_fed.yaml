name: Smoothed US recession probability (Chauvet-Piger model)
shortName: Recession probability
description: |
  Smoothed recession probability for the US from the Chauvet-Piger
  dynamic-factor Markov-switching model — combines nonfarm payrolls,
  industrial production, real personal income (less transfers), and
  real manufacturing/trade sales into a single latent-state estimate
  of whether the economy is in recession this month. Monthly,
  published with about a 1-month lag.

  Distinct from:
    - the NBER binary indicator (judgmental, declared months later)
    - the NY Fed's yield-curve-derived probability (different model,
      different underlying signal, not on FRED — see the New York
      Fed's "Probability of US recession" web page)
    - the SPF "Anxious Index" (a poll of forecasters)

  This was previously labeled as the NY Fed yield-curve model — that
  was wrong. RECPROUSM156N is Chauvet-Piger; the NY Fed yield-curve
  probability isn't a single FRED series.
kind: timeseries
pipeline: fred_series
dataFile: data/fred/RECPROUSM156N.json
supportedDeltas: ["1y", "5y", "10y", "30y"]
unit: "%"
formatting:
  style: percent
  decimals: 1
emphasis: change
provenance:
  provider: FRED (St. Louis Fed)
  series: RECPROUSM156N
  url: https://fred.stlouisfed.org/series/RECPROUSM156N
  license: Public domain (US government data)
tags:
  - macro
  - us
unitClass: rate

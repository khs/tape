name: St. Louis Fed Financial Stress Index
shortName: STLFSI
description: St. Louis Fed Financial Stress Index, version 4. Weekly. A z-score that combines 18 financial-market series into one number; zero is normal, positive is stressed. Alternative to Chicago Fed's NFCI; reads differently because of variable weighting and the underlying index basket.
kind: timeseries
pipeline: fred_series
dataFile: data/fred/STLFSI4.json
supportedDeltas: ["1m", "ytd", "1y", "5y", "10y", "30y"]
unit: "index (z-score)"
formatting:
  style: number
  decimals: 2
emphasis: change
provenance:
  provider: FRED (St. Louis Fed)
  series: STLFSI4
  url: https://fred.stlouisfed.org/series/STLFSI4
  license: Public domain (US government data)
tags:
  - macro
  - rates
  - us
unitClass: index

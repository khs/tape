  decimals: 0
  notation: compact
  scaleFactor: 1000000000
provenance:
  provider: U.S. federal-agency data via FRED
  series: FGEXPND
  url: https://fred.stlouisfed.org/series/FGEXPND
  license: "Public domain (US government data; see FRED tag 'public domain: citation requested')"
tags:

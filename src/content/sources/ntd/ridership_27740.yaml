name: "Transit ridership — Johnson City, TN"
shortName: "Johnson City, TN transit ridership"
description: "Monthly public-transit ridership (unlinked passenger trips, all modes) for the Johnson City, TN urbanized area, summed across the transit agencies the FTA National Transit Database assigns to that area, then keyed to CBSA 27740. The urbanized area is the dense core, not the full metro. Captures the post-2020 ridership collapse and recovery."
kind: timeseries
pipeline: ntd
dataFile: data/ntd/ridership_27740.json
supportedDeltas: ["1m", "1y", "5y", "10y"]
unit: "trips"
formatting:
  style: number
  decimals: 0
  notation: compact
emphasis: change
provenance:
  provider: U.S. DOT Federal Transit Administration (National Transit Database)
  series: "NTD monthly UPT / UZA -> CBSA 27740"
  url: https://www.transit.dot.gov/ntd/data-product/monthly-module-adjusted-data-release
  license: Public domain (US government data)
unitClass: count

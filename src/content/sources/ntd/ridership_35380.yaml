name: "Transit ridership — New Orleans-Metairie, LA"
shortName: "New Orleans-Metairie, LA transit ridership"
description: "Monthly public-transit ridership (unlinked passenger trips, all modes) for the New Orleans-Metairie, LA urbanized area, summed across the transit agencies the FTA National Transit Database assigns to that area, then keyed to CBSA 35380. The urbanized area is the dense core, not the full metro. Captures the post-2020 ridership collapse and recovery."

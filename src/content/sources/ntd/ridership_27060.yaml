name: "Transit ridership — Ithaca, NY"
shortName: "Ithaca, NY transit ridership"
description: "Monthly public-transit ridership (unlinked passenger trips, all modes) for the Ithaca, NY urbanized area, summed across the transit agencies the FTA National Transit Database assigns to that area, then keyed to CBSA 27060. The urbanized area is the dense core, not the full metro. Captures the post-2020 ridership collapse and recovery."

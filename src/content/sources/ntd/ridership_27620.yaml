name: "Transit ridership — Jefferson City, MO"
shortName: "Jefferson City, MO transit ridership"
description: "Monthly public-transit ridership (unlinked passenger trips, all modes) for the Jefferson City, MO urbanized area, summed across the transit agencies the FTA National Transit Database assigns to that area, then keyed to CBSA 27620. The urbanized area is the dense core, not the full metro. Captures the post-2020 ridership collapse and recovery."

name: "Transit ridership — Lansing-East Lansing, MI"
shortName: "Lansing-East Lansing, MI transit ridership"
description: "Monthly public-transit ridership (unlinked passenger trips, all modes) for the Lansing-East Lansing, MI urbanized area, summed across the transit agencies the FTA National Transit Database assigns to that area, then keyed to CBSA 29620. The urbanized area is the dense core, not the full metro. Captures the post-2020 ridership collapse and recovery."

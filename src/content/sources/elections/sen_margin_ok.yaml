description: 'Two-party vote margin (Democratic minus Republican) as a share of the total vote, in percentage points, for the US Senate race in Oklahoma, by election year. Positive values lean Democratic, negative Republican. Computed from MEDSL (MIT Election Data and Science Lab) returns via Harvard Dataverse. US Senate general elections (excluding special elections), 1976 to 2024; a state appears only in the cycles its seat was up.'

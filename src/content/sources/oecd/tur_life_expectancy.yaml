name: Turkey life expectancy
shortName: TR life expectancy
description: Life expectancy at birth, both sexes combined. OECD Health
  Statistics. Annual.
# Retired (data-quality audit, 2026-06): the OECD DF_LE series for Turkey
# has a pre-2017 vintage discontinuity (an implausible +3.4yr single-year
# jump into a flat 78.0 plateau across 2013-2016) and lags its OECD
# siblings by ~1-2 years. Unreferenced by any chart (Turkey is not in the
# G7 life-expectancy chart). Kept hidden rather than hand-editing values;
# if revived, first verify 2012-2017 against the OECD SDMX API and TurkStat
# life tables. Allowlisted in the --full audit cohort pass.
hidden: true
kind: timeseries
pipeline: oecd
dataFile: data/oecd/tur_life_expectancy.json
supportedDeltas: ["1y", "5y", "10y", "30y", "50y"]
unit: years
formatting:
  style: number
  decimals: 1
  suffix: " yrs"
emphasis: change
provenance:
  provider: OECD
  series: life_expectancy (TUR)
  url: https://data-explorer.oecd.org/
  license: Reuse permitted including commercial, with attribution (OECD; CC BY 4.0 since Jul 2024)
unitClass: ratio

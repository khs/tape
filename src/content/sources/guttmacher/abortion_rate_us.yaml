description: 'Abortions per 1,000 women aged 15 to 44 in the United States, by year. Guttmacher Institute Abortion Provider Census for 1973 to 2020, spliced with the Guttmacher Monthly Abortion Provision Study for 2023 to 2025. Both count nationally, unlike CDC Abortion Surveillance, which excludes several states including California. The two Guttmacher series use different methods and 2021 to 2022 are not covered, so the recent points are not strictly comparable with the earlier census.'

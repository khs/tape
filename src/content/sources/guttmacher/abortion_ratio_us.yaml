name: 'Abortion ratio — United States'
shortName: 'US abortion ratio'
description: 'Abortions per 1,000 live births in the United States, by year. The Guttmacher Institute Abortion Provider Census reports this ratio directly for 1973 to 2020. For 2023 and 2024 it is computed as Guttmacher Monthly Abortion Provision Study abortions divided by CDC NCHS live births; 2025 abortions are available but the 2025 ratio awaits final 2025 birth totals. Because Guttmacher counts nationally (all 50 states and DC, unlike CDC Abortion Surveillance, which excludes California and others), this ratio runs well above the CDC abortion-surveillance figure.'

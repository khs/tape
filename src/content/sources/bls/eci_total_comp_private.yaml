name: Employment Cost Index — private-industry compensation
shortName: ECI private comp
description: Employment Cost Index for total compensation (wages plus benefits) of
  private-industry workers. A fixed-weight index of labor cost per hour worked, so
  it is not skewed by shifts in the mix of jobs. Quarterly, seasonally adjusted.
  From the BLS National Compensation Survey.

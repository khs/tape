name: Employment Cost Index — civilian total compensation
shortName: ECI civilian comp
description: Employment Cost Index for total compensation (wages plus benefits) of
  all civilian workers, which covers private industry plus state and local
  government. A fixed-weight index of labor cost per hour worked, so it is not
  skewed by shifts in the mix of jobs. The headline ECI, watched closely as a
  wage-pressure gauge. Quarterly, seasonally adjusted. From the BLS National
  Compensation Survey.
kind: timeseries

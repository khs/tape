name: Employment Cost Index — civilian wages and salaries
shortName: ECI civilian wages
description: Employment Cost Index for the wages-and-salaries portion of civilian
  workers' compensation (excluding benefits). A fixed-weight index of wage cost
  per hour worked, so it is not skewed by shifts in the mix of jobs. Quarterly,
  seasonally adjusted. From the BLS National Compensation Survey.

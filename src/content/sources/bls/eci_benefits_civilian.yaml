name: Employment Cost Index — civilian benefits
shortName: ECI civilian benefits
description: Employment Cost Index for the benefits portion of civilian workers'
  compensation (health insurance, retirement, paid leave, and the like). A
  fixed-weight index of benefit cost per hour worked, so it is not skewed by
  shifts in the mix of jobs. Quarterly, seasonally adjusted. From the BLS
  National Compensation Survey.

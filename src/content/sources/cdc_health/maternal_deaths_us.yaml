description: 'Number of maternal deaths in the United States, by year (the numerator behind the maternal mortality rate). CDC / National Center for Health Statistics, Vital Statistics Rapid Release. National only; most state cells are suppressed. Figures use the post-2018 pregnancy-checkbox coding and are not comparable to maternal mortality published before 2018 (historically near 12 to 15 per 100,000). Each year is the December 12-month-ending window (the calendar-year value); recent years are provisional and revised as records complete.'

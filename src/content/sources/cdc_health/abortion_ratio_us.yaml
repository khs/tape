description: 'Legal induced abortions per 1,000 live births in the United States, by year. CDC / National Center for Health Statistics, Abortion Surveillance. National only. CDC abortion surveillance is voluntary and incomplete: several areas do not report, including California, Maryland, New Hampshire, and New Jersey, so the count undercounts total US abortions. These figures use the 47 areas that reported every year from 2013 to 2022, so the series is consistent over time; the fuller national count published by the Guttmacher Institute is substantially higher. Recent years are provisional.'

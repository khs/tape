name: Zillow Observed Rent Index — Los Angeles, CA
shortName: Los Angeles ZORI
description: |
  Zillow Observed Rent Index (ZORI) — typical observed market-rate rent across a region, repeat-rent index weighted to the rental housing stock. Monthly back to January 2015. Catches asking-rent changes ~12 months earlier than CPI Shelter, which uses contract rent + a slow-rolling renewal weight.

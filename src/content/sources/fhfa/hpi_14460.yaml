description: FHFA all-transactions House Price Index for the Boston-Cambridge-Newton, MA-NH metro area (CBSA 14460). Repeat-sales index of single-family properties with conforming mortgages; not seasonally adjusted, quarterly. The public-domain federal substitute for the proprietary Case-Shiller index. FHFA publishes this metro only at the metropolitan-division level, so values are its principal division, Boston, MA (FHFA area 14454).

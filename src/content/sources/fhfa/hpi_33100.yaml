description: FHFA all-transactions House Price Index for the Miami-Fort Lauderdale-West Palm Beach, FL metro area (CBSA 33100). Repeat-sales index of single-family properties with conforming mortgages; not seasonally adjusted, quarterly. The public-domain federal substitute for the proprietary Case-Shiller index. FHFA publishes this metro only at the metropolitan-division level, so values are its principal division, Miami-Miami Beach-Kendall, FL (FHFA area 33124).

description: FHFA all-transactions House Price Index for the Detroit-Warren-Dearborn, MI metro area (CBSA 19820). Repeat-sales index of single-family properties with conforming mortgages; not seasonally adjusted, quarterly. The public-domain federal substitute for the proprietary Case-Shiller index. FHFA publishes this metro only at the metropolitan-division level, so values are its principal division, Detroit-Dearborn-Livonia, MI (FHFA area 19804).

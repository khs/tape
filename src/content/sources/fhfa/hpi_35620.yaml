description: FHFA all-transactions House Price Index for the New York-Newark-Jersey City, NY-NJ metro area (CBSA 35620). Repeat-sales index of single-family properties with conforming mortgages; not seasonally adjusted, quarterly. The public-domain federal substitute for the proprietary Case-Shiller index. FHFA publishes this metro only at the metropolitan-division level, so values are its principal division, New York-Jersey City-White Plains, NY-NJ (FHFA area 35614).

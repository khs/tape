description: FHFA all-transactions House Price Index for the Dallas-Fort Worth-Arlington, TX metro area (CBSA 19100). Repeat-sales index of single-family properties with conforming mortgages; not seasonally adjusted, quarterly. The public-domain federal substitute for the proprietary Case-Shiller index. FHFA publishes this metro only at the metropolitan-division level, so values are its principal division, Dallas-Plano-Irving, TX (FHFA area 19124).

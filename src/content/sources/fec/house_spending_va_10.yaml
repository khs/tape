name: House campaign spending — Virginia 10
shortName: VA-10 campaign $
description: Total campaign disbursements by all U.S. House candidates who ran in Virginia district 10, summed per two-year election cycle, from the Federal Election Commission. District numbers reflect the boundaries in effect each cycle (redistricting redrew them after the 2010 and 2020 censuses).
kind: timeseries
pipeline: fec
dataFile: data/fec/house_spending_va_10.json
supportedDeltas: ["10y", "30y"]
unit: "millions USD"
formatting:
  style: currency
  decimals: 1
  suffix: "M"
emphasis: change
defaultAnnotations:
  - date: "2012-01-01"
    label: "Boundaries redrawn — 2010 Census"
  - date: "2022-01-01"
    label: "Boundaries redrawn — 2020 Census"
provenance:
  provider: FEC (Federal Election Commission)
  series: candidates/totals office=H sum(disbursements) VA-10
  url: https://www.fec.gov/data/
  license: Public domain (US government data)
tags:
  - elections
  - us
  - us-cd
unitClass: currency

name: House campaign spending — Ohio 07
shortName: OH-07 campaign $
description: Total campaign disbursements by all U.S. House candidates who ran in Ohio district 7, summed per two-year election cycle, from the Federal Election Commission. District numbers reflect the boundaries in effect each cycle (redistricting redrew them after the 2010 and 2020 censuses).
kind: timeseries
pipeline: fec
dataFile: data/fec/house_spending_oh_07.json
supportedDeltas: ["10y", "30y"]
unit: "millions USD"
formatting:
  style: currency
  decimals: 1
  suffix: "M"
emphasis: change
defaultAnnotations:
  - date: "2012-01-01"
    label: "Boundaries redrawn — 2010 Census"
  - date: "2022-01-01"
    label: "Boundaries redrawn — 2020 Census"
provenance:
  provider: FEC (Federal Election Commission)
  series: candidates/totals office=H sum(disbursements) OH-07
  url: https://www.fec.gov/data/
  license: Public domain (US government data)
tags:
  - elections
  - us
unitClass: currency

name: Refresh demographics data

# Census ACS + metro-area pipelines, separated from the weekly market-
# data refresh because they're an order of magnitude slower (multi-
# vintage tract-level fetches, ~387 CBSAs, 19 fiscal years of county
# spending data). Scheduled monthly on the 1st at 06:00 UTC since the
# underlying data only updates annually (ACS) or per-fiscal-year
# (USAspending). Manual trigger available for ad-hoc runs.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

# Shared with refresh-data.yml so the two never race pushes to main. When the
# 1st of the month falls on a Sunday both fire at 06:00 UTC; a shared group
# with cancel-in-progress:false makes one wait for the other to finish.
concurrency:
  group: "data-refresh-main"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 6-hour ceiling. After expanding tract + block_group to all 50
    # states + DC, a clean (cache-empty) run takes ~3-4 hours for the
    # API-bound fetches; most runs are much shorter because immutable
    # vintages skip on disk-cache hit. The buffer also covers adding
    # more ACS indicators or new geographic pipelines without
    # re-touching this file.
    timeout-minutes: 360
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyyaml python-dotenv requests openpyxl xlrd

      # Nag if a newer ACS/TIGER vintage is published than what the
      # hardcoded-vintage pipelines are pinned to. Warn-only (the freshness
      # gate can't see this — most ACS series are unreferenced + annual
      # cohort lag is tolerated). Prints ::warning:: lines; never blocks.
      - name: Check for newer upstream vintages
        continue-on-error: true
        run: python pipelines/check_vintage_freshness.py

      # Census ACS by congressional district — the v4 expansion bumped
      # this from 4 indicators to 36, fetching multiple cells per
      # indicator across 13 ACS vintages × 51 states.
      - name: Refresh Census ACS by congressional district
        continue-on-error: true
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python pipelines/census_acs_cd.py

      # Connecticut backfill: from 2022 on CT publishes tracts on new COG
      # planning-region FIPS the tract->CD118 crosswalk can't map, so the CD
      # step freezes CT at 2021. CT didn't redistrict, so fetch its 5 CDs
      # directly at CD geography for the new vintages. Must run AFTER the CD
      # step (lays down CT 2010-2021) and BEFORE the state derive (which then
      # rolls the now-complete CT CDs up to acs_state).
      - name: Backfill Connecticut CDs (direct CD fetch)
        continue-on-error: true
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python pipelines/census_acs_cd_ct_direct.py

      # Census ACS at the metropolitan-statistical-area level. Same
      # indicator set; fetched at CBSA geography (~387 metros).
      - name: Refresh Census ACS by metropolitan area
        continue-on-error: true
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python pipelines/census_acs_metro.py

      # Census ACS at the US national level. Single-row-per-vintage
      # fetch — cheap, but lives here for code locality with the rest of
      # the Census ACS pipelines.
      - name: Refresh Census ACS at the national level
        continue-on-error: true
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python pipelines/census_acs_national.py

      # Derive per-state ACS series by aggregating the per-CD data.
      # Must run AFTER census_acs_cd.py so the fresh CD data feeds it.
      # Doesn't need CENSUS_API_KEY (works off the data files on disk).
      - name: Derive Census ACS at the state level (from per-CD aggregates)
        continue-on-error: true
        run: python pipelines/derive_acs_state_from_cd.py

      # Derive cross-sectional state-level choropleth snapshots from the
      # state-level time-series files that the previous step produces.
      # Output: public/data/acs_state/<indicator>_<vintage>.json — one
      # file per (indicator, vintage), one entry per state. Feeds the
      # choropleth chart type. Doesn't need CENSUS_API_KEY.
      - name: Derive ACS choropleth snapshots (state level)
        continue-on-error: true
        run: python pipelines/census_acs_choropleth_derive_state.py

      # Direct Census-API choropleth fetch for state / county / tract /
      # block-group. CENSUS_API_KEY required. The state-level call
      # runs AFTER the derivation step so its output OVERRIDES any
      # derivation gaps — notably Connecticut 2022 (the tract→CD
      # crosswalk's pre-Planning-Region county FIPS don't match the
      # ACS API's new PR-based tract GEOIDs) and DC's missing AGG_SUM
      # indicators (DC tracts aren't in the crosswalk at all because
      # build_crosswalks.py filters out non-voting delegates).
      # Tract + block-group default to VA for now — full-US fetch
      # at those granularities is a separate manual run because the
      # API call volume is large.
      - name: Refresh ACS choropleth snapshots (state, direct API)
        continue-on-error: true
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python pipelines/census_acs_choropleth.py --geo state

      - name: Refresh ACS choropleth snapshots (county)
        continue-on-error: true
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python pipelines/census_acs_choropleth.py --geo county

      # Tract-level coverage across every state + DC. Each state's
      # fast-path call returns all that state's tracts in one ~5MB
      # response (3-30 sec each), so the full pull is ~30-60 min of
      # mostly-network-bound API time. Each indicator × vintage that
      # already has a file on disk is cache-skipped — only the latest
      # 1-2 vintages re-fetch on a typical run.
      - name: Refresh ACS choropleth snapshots (tract, all states)
        continue-on-error: true
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python pipelines/census_acs_choropleth.py --geo tract --state all

      # Block-group-level coverage across every state + DC. Heavier
      # than tract because the per-state response is ~10MB; full pull
      # is ~60-120 min on a clean run, much shorter when most vintages
      # are already cache-skipped. continue-on-error kept so a partial
      # BG failure doesn't block the rest of the commit; the pipeline
      # exits non-zero AND prints a ##[error] line for visibility.
      - name: Refresh ACS choropleth snapshots (block_group, all states)
        continue-on-error: true
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python pipelines/census_acs_choropleth.py --geo block_group --state all

      # World Bank — China deep-dive + regional/continent aggregates
      # (Africa, Europe, etc.). Annual data, slow-moving; lives here
      # rather than in the weekly market-data workflow.
      - name: Refresh World Bank extended (China + regions)
        continue-on-error: true
        run: python pipelines/worldbank_extended.py

      # Federal spending per metro. 19 fiscal years × county-level
      # fetches × CBSA rollup.
      - name: Refresh USAspending metro federal flows
        continue-on-error: true
        run: python pipelines/usaspending_metro.py

      # BLS metro employment + unemployment. Anonymous BLS API has a
      # daily quota; partial fetches are normal and the pipeline handles
      # them gracefully (writes whatever it got).
      - name: Refresh BLS metro series
        continue-on-error: true
        run: python pipelines/bls_metro.py

      # Metro federal data layer (CBSA-keyed; built 2026-06; all fast).
      # FHFA / Census permits / FTA NTD are keyless. BEA needs BEA_API_KEY in
      # repo secrets -- continue-on-error keeps the refresh green until that
      # secret lands (like EIA), and bea starts populating once it is set.
      - name: Refresh FHFA metro House Price Index
        continue-on-error: true
        run: python pipelines/fhfa.py

      - name: Refresh BEA Regional (state + metro income + county choropleth)
        continue-on-error: true
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: |
          python pipelines/bea.py
          python pipelines/bea.py metro
          python pipelines/bea.py county

      - name: Refresh Census metro building permits
        continue-on-error: true
        run: python pipelines/census_bps.py

      - name: Refresh FTA NTD metro transit ridership
        continue-on-error: true
        run: python pipelines/ntd.py

      # State-level annual datasets — they update yearly (or biennially
      # for NAEP), so they live in this monthly workflow rather than the
      # weekly market-data one. Source YAMLs are static (scaffolded
      # once, committed); these steps only refresh public/data/, which
      # the commit step below stages wholesale via `git add public/data/`.

      # Census Annual Survey of State Government Finances (~51 calls).
      - name: Refresh Census state-government finances
        continue-on-error: true
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python pipelines/census_govfin.py

      # ACS 1-year unemployment rate by race / Hispanic origin, by state.
      - name: Refresh ACS unemployment by race (state)
        continue-on-error: true
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python pipelines/census_acs_labor.py

      # NAEP ("Nation's Report Card") state test scores — NCES public
      # data service, no API key required.
      - name: Refresh NAEP state test scores
        continue-on-error: true
        run: python pipelines/naep_scores.py

      # K-12 per-pupil spending by state — NCES Common Core of Data via
      # the Urban Institute Education Data Portal, no API key required.
      - name: Refresh NCES per-pupil K-12 spending
        continue-on-error: true
        run: python pipelines/edu_spending.py

      # Other periodic providers (annual / monthly external data). Wired here so
      # they auto-renew on the monthly cadence; all fail-soft. The four keyed
      # ones use repo secrets that already exist.
      - name: Refresh CDC public-health indicators
        continue-on-error: true
        run: python pipelines/cdc_health.py

      - name: Refresh CMS National Health Expenditure
        continue-on-error: true
        run: python pipelines/cms_nhe.py

      - name: Refresh EIA retail electricity + natural-gas prices
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python pipelines/eia_prices.py

      - name: Refresh FBI crime data
        continue-on-error: true
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
        run: python pipelines/fbi_crime.py

      - name: Refresh NHTSA FARS traffic fatalities
        continue-on-error: true
        run: python pipelines/nhtsa_fars.py

      - name: Refresh NOAA climate
        continue-on-error: true
        env:
          NOAA_API_KEY: ${{ secrets.NOAA_API_KEY }}
        run: python pipelines/noaa_climate.py

      - name: Refresh OWID CO2 emissions
        continue-on-error: true
        run: python pipelines/owid_co2.py

      - name: Refresh OWID energy
        continue-on-error: true
        run: python pipelines/owid_energy.py

      - name: Refresh USDA NASS agriculture
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python pipelines/usda_nass.py

      - name: Refresh USGS water use
        continue-on-error: true
        run: python pipelines/usgs_water.py

      - name: Refresh Zillow home values + rents
        continue-on-error: true
        run: python pipelines/zillow.py

      # Source YAMLs auto-generate from data files for the ACS pipelines.
      # Idempotent — only writes files that don't already exist.
      - name: Generate ACS-CD source YAMLs from fresh data files
        run: python pipelines/_generate_acs_sources.py

      - name: Generate ACS-national source YAMLs from fresh data files
        run: python pipelines/_generate_acs_national_sources.py

      # Generate tile-summary sibling files. Same script the
      # market-data workflow runs; idempotent across runs. Scans every
      # data file so summaries stay consistent after both workflows.
      - name: Build per-source tile summaries
        run: python pipelines/build_summaries.py

      # Generators-tab catalog — cheap to regenerate (~2s); reads only
      # source YAMLs so the ACS / metro / state additions from this
      # workflow land in the catalog the composer fetches.
      - name: Refresh generators index
        run: python pipelines/_generate_generators_index.py

      - name: Trim source data files to supportedDeltas
        run: python pipelines/trim_source_data.py

      # (Snapshot-data step removed — see refresh-data.yml's matching
      # comment block for the rationale: git history covers vintage
      # recovery without ballooning public/data past Vercel's build-
      # function-tracer memory ceiling.)

      # Cross-provider label audit. See refresh-data.yml for the
      # rationale + docs/new-data-source-checklist.md for adding
      # coverage to a new provider.
      - name: Audit source labels against provider authoritative titles
        run: python scripts/audit_all_sources.py --strict

      # Normalize + strict-audit user-facing source copy (descriptions /
      # provenance.notes): strip fetch/implementation-detail leaks and spell
      # out title acronyms, then fail on any remaining violation. This matters
      # most here — the demographics refresh scaffolds the bulk of new ACS /
      # NAEP / World Bank source YAMLs. See pipelines/audit_source_descriptions.py.
      - name: Normalize source descriptions
        run: python pipelines/fix_source_descriptions.py
      - name: Audit source descriptions (strict)
        run: python pipelines/audit_source_descriptions.py --strict

      # Indicator alerts: evaluate rules against the freshly-refreshed
      # demographic + metro source data files. ACS series only update
      # annually (or per-vintage), so most monthly runs will find no
      # new observations and skip every rule — but the few that do
      # update (USAspending metro / BLS metro / World Bank extended)
      # fire alerts here. See refresh-data.yml for the per-step
      # rationale comment.
      - name: Evaluate indicator alerts
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python pipelines/check_alerts.py

      - name: Dispatch alert emails
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_API_KEY: ${{ secrets.POSTMARK_API_KEY }}
          ALERTS_FROM_ADDRESS: ${{ secrets.ALERTS_FROM_ADDRESS }}
          ALERTS_FROM_NAME: ${{ secrets.ALERTS_FROM_NAME }}
        run: python pipelines/dispatch_alert_emails.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Race-safe commit pattern. Demographics workflow runs for
          # 30+ min during which lots of src/ changes can land on main.
          # We reset to the LATEST origin/main and then add ONLY the
          # data + auto-generated source paths we touched — anything
          # else in the workflow's working tree (stale src/, stale
          # scripts/, etc.) is restored to origin/main's version so
          # we never accidentally revert other people's commits.
          #
          # Earlier versions used `reset --soft` and relied on the
          # index/working-tree match — but reset --soft keeps the
          # workflow's initial-checkout src/ in the worktree, and a
          # subsequent `git add public/data/` followed by a commit
          # could still pull in modified src/ files if anything else
          # had changed them. The May 2026 incident (commit 46e3bb012
          # reverted 11 hand-edited src/ files) was caused by exactly
          # that path. Switched to `reset --hard` + selective add
          # below: data paths are explicitly re-staged from disk,
          # everything else is whatever's on origin/main.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # Snapshot the data dirs we modified before we reset (so
            # reset --hard doesn't wipe them).
            tmp=$(mktemp -d)
            mkdir -p "$tmp/public" "$tmp/src/content/sources"
            cp -r public/data "$tmp/public/" 2>/dev/null || true
            for dir in acs_cd acs_state acs_national acs_metro usaspending bls worldbank_extended naep edu_spending census_govfin acs_labor fhfa bea census_bps ntd cdc_health cms_nhe eia_prices fbi_crime nhtsa_fars noaa_climate owid_co2 owid_energy usda_nass usgs_water zillow; do
              if [ -d "src/content/sources/$dir" ]; then
                cp -r "src/content/sources/$dir" "$tmp/src/content/sources/" 2>/dev/null || true
              fi
            done
            git reset --hard origin/main
            # NON-DESTRUCTIVE overlay — do NOT `rm -rf public/data`. Another
            # job (or a manual push) may have ADDED a provider's data to main
            # during this 30-min run; wiping the dir and restoring only our
            # snapshot deletes it. That is the 2026-06 incident: this refresh's
            # snapshot (taken before noaa/owid/fbi/bea were pushed) clobbered
            # all 4 providers. Overlay updates what we regenerated and leaves
            # every other provider's data intact.
            cp -r "$tmp/public/data/." public/data/
            # These source-YAML dirs are owned solely by this workflow's
            # pipelines (generators + inline emitters), so replacing them
            # wholesale is safe (no other job adds to them).
            for dir in acs_cd acs_state acs_national acs_metro usaspending bls worldbank_extended naep edu_spending census_govfin acs_labor fhfa bea census_bps ntd cdc_health cms_nhe eia_prices fbi_crime nhtsa_fars noaa_climate owid_co2 owid_energy usda_nass usgs_water zillow; do
              if [ -d "$tmp/src/content/sources/$dir" ]; then
                rm -rf "src/content/sources/$dir"
                cp -r "$tmp/src/content/sources/$dir" "src/content/sources/"
              fi
            done
            rm -rf "$tmp"
            # Rebuild cross-provider aggregates from the merged tree so a
            # provider added by another job during this run stays indexed.
            python pipelines/build_summaries.py
            python pipelines/_generate_generators_index.py
            git add public/data/ public/generators-index.json
            for dir in acs_cd acs_state acs_national acs_metro usaspending bls worldbank_extended naep edu_spending census_govfin acs_labor fhfa bea census_bps ntd cdc_health cms_nhe eia_prices fbi_crime nhtsa_fars noaa_climate owid_co2 owid_energy usda_nass usgs_water zillow; do
              git add "src/content/sources/$dir/" 2>/dev/null || true
            done
            if git diff --cached --quiet; then
              echo "No data changes to commit (attempt $attempt)."
              exit 0
            fi
            git commit -m "chore: monthly demographics-data refresh"
            if git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push lost a race on attempt $attempt; refetching and retrying"
            sleep 5
          done
          echo "Failed to push after 5 attempts." >&2
          exit 1

name: Refresh market data

# Weekly Sunday 06:00 UTC, plus manual trigger. Heavy demographics work
# (Census ACS + metro pipelines) lives in refresh-demographics.yml so
# this workflow stays fast and reliably finishes well under the timeout.
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

# Shared with refresh-demographics.yml so the two never race pushes to main.
# When the 1st of the month falls on a Sunday both fire at 06:00 UTC; a shared
# group with cancel-in-progress:false makes one wait for the other to finish.
concurrency:
  group: "data-refresh-main"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 3-hour ceiling. Real runtime is ~15 min today, but the buffer lets
    # us add more pipelines without re-touching this file each time.
    timeout-minutes: 180
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas pyyaml python-dotenv requests

      # Pipelines are run independently with continue-on-error so one failing
      # provider (Yahoo rate-limiting us, FRED rejecting a series id, etc.)
      # doesn't block the rest. Ordering matters: countries_relative reads VT
      # + country-ETF data written by yahoo_quotes.

      - name: Refresh FRED series
        continue-on-error: true
        run: python pipelines/fred_series.py

      - name: Refresh Yahoo quotes (equities, ETFs, futures)
        continue-on-error: true
        run: python pipelines/yahoo_quotes.py

      - name: Refresh Yahoo market caps (tech mega-caps)
        continue-on-error: true
        run: python pipelines/yahoo_marketcap.py

      - name: Compute countries-relative (country ETF / VT)
        continue-on-error: true
        run: python pipelines/countries_relative.py

      - name: Refresh World Bank real-GDP shares
        continue-on-error: true
        run: python pipelines/worldbank_gdp.py

      - name: Refresh BLS subseries (CPI components, JOLTS, state unemployment)
        continue-on-error: true
        run: python pipelines/bls.py

      # CBO is blocked on DataDome bot protection from non-browser
      # clients; no-ops until someone manually drops an XLSX into
      # pipelines/cbo_data/. See cbo.py docstring.
      - name: Refresh CBO projections (manual XLSX only)
        continue-on-error: true
        run: python pipelines/cbo.py

      # OECD: G7 unemployment + CPI; all-OECD-member debt + deficit + life
      # expectancy + health spending. Multi-country requests batch to stay
      # under the public API's rate limits.
      - name: Refresh OECD cross-country comparisons
        continue-on-error: true
        run: python pipelines/oecd.py

      # Treasury TIC — foreign holdings of US Treasuries by country.
      # Monthly back to 2000.
      - name: Refresh Treasury TIC (foreign holdings)
        continue-on-error: true
        run: python pipelines/treasury_tic.py

      # USAspending: federal $ flowing to each state and each
      # congressional district, by fiscal year, since FY2008.
      - name: Refresh USAspending state + CD federal flows
        continue-on-error: true
        run: python pipelines/usaspending.py

      # EIA electricity net generation by state + fuel (annual; ~52
      # light API calls). Needs EIA_API_KEY in repo secrets —
      # continue-on-error keeps the refresh green if that secret isn't
      # set yet (the pipeline exits non-zero on a missing key), and the
      # step starts populating data on its own once the secret lands.
      - name: Refresh EIA state electricity generation
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python pipelines/eia_state_energy.py

      # Generate tile-summary sibling files (<id>.summary.json) from the
      # full source data. Computed BEFORE trimming so summaries capture
      # the longest available history.
      - name: Build per-source tile summaries
        run: python pipelines/build_summaries.py

      # Generators-tab catalog — discovered (geo, template) pairs +
      # per-entity source IDs. Cheap (~2s) and depends only on source
      # YAMLs, but we run it post-data-refresh so a new metro / state
      # / country source landing in this run shows up in the catalog
      # the composer fetches.
      - name: Refresh generators index
        run: python pipelines/_generate_generators_index.py

      # Trim each source data file in place to its declared longest
      # supportedDeltas window (+10% buffer). Sources that top out at
      # 10y don't need 50 years of daily prices in their JSON; this cuts
      # the fresh-data tree by ~50% with zero renderer changes.
      - name: Trim source data files to supportedDeltas
        run: python pipelines/trim_source_data.py

      # (Snapshot-data step removed.) Was archiving the whole data/
      # tree into data/_archive/<YYYY-MM-DD>/ each run. Citation
      # integrity now relies on git history of public/data/ — every
      # refresh commits, every revision is in the commit log. The
      # archive directory was pushing public/ past Vercel's build-
      # function-tracer memory ceiling.

      # Cross-provider label audit. Runs FRED, World Bank, and Yahoo
      # audits in sequence — each compares our YAML labels against the
      # provider's authoritative title and exits 1 on mismatches.
      # Blocks the data refresh from publishing if drift is detected.
      # See docs/new-data-source-checklist.md for how to add coverage
      # for a new provider.
      - name: Audit source labels against provider authoritative titles
        run: python scripts/audit_all_sources.py --strict

      # User-facing source COPY: normalize any freshly-scaffolded
      # description / provenance.notes to the house style (strip
      # fetch/implementation-detail leaks — "endpoint", "ingest",
      # "yfinance", … — and spell out domain/fund acronyms that appear in
      # the title), then fail the run if anything still violates. Keeps the
      # source-page copy clean as new entities land without a human
      # re-reviewing every scaffold. See pipelines/audit_source_descriptions.py.
      - name: Normalize source descriptions
        run: python pipelines/fix_source_descriptions.py
      - name: Audit source descriptions (strict)
        run: python pipelines/audit_source_descriptions.py --strict

      # Magnitude/scale sanity: flags sources whose latest value's order of
      # magnitude doesn't fit its declared unit/format (e.g. raw dollars
      # stored as billions, %-as-decimal vs %-as-100). Report-only — the
      # classify() heuristic is unit-tested in CI (test_audit_source_scales),
      # but the corpus-wide scan previously ran NOWHERE; this surfaces it in
      # the refresh log each run without blocking the publish on a heuristic.
      - name: Audit source magnitudes (report)
        run: python pipelines/audit_source_scales.py

      # Indicator alerts: evaluate every active alert_rules row against
      # the freshly-refreshed source data files. Writes alert_triggers
      # rows when a rule fires. Idempotent — skips rules whose source's
      # latest observation date matches the rule's last_value_t.
      # Soft-fails when env is unset so a missing secret doesn't tank
      # the data-refresh commit; the alert evaluator just no-ops.
      - name: Evaluate indicator alerts
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python pipelines/check_alerts.py

      # Email dispatch for any alert_triggers rows where notified_at
      # is still null. Reads RESEND_API_KEY or POSTMARK_API_KEY plus
      # ALERTS_FROM_ADDRESS from secrets. Same soft-fail semantics —
      # missing email-provider config leaves triggers queued for a
      # future run to dispatch.
      - name: Dispatch alert emails
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_API_KEY: ${{ secrets.POSTMARK_API_KEY }}
          ALERTS_FROM_ADDRESS: ${{ secrets.ALERTS_FROM_ADDRESS }}
          ALERTS_FROM_NAME: ${{ secrets.ALERTS_FROM_NAME }}
        run: python pipelines/dispatch_alert_emails.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Race-safe commit pattern. The pipelines just wrote fresh
          # data to the working tree; other commits may have landed on
          # origin during the long pipeline run. Strategy:
          #   1. Snapshot the data + inline source-YAML dirs we own to a
          #      tmp location.
          #   2. reset --hard to origin/main — discards stale src/
          #      from the workflow's initial checkout.
          #   3. Replay the snapshot into place.
          #   4. Stage + commit ONLY the paths we explicitly add.
          #
          # The earlier `reset --soft` pattern silently kept stale
          # src/ in the working tree; if the index ever drifted, a
          # subsequent git add could pull those reverted files into
          # the commit. The May 2026 incident (commit 46e3bb012
          # reverted ~380 src/ lines under a "data refresh" message)
          # was caused by exactly that. The reset --hard pattern
          # guarantees src/ matches origin/main at commit time.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            tmp=$(mktemp -d)
            cp -r public/data "$tmp/" 2>/dev/null || true
            # Inline-emitted source YAMLs (Plan 7): snapshot the dirs whose
            # pipelines this workflow runs, same treatment as the data dirs.
            mkdir -p "$tmp/src/content/sources"
            for dir in eia_state_energy; do
              if [ -d "src/content/sources/$dir" ]; then
                cp -r "src/content/sources/$dir" "$tmp/src/content/sources/" 2>/dev/null || true
              fi
            done
            git reset --hard origin/main
            # NON-DESTRUCTIVE overlay — do NOT `rm -rf public/data`. Another
            # job (or a manual push) may have ADDED a provider's data to main
            # during this run; wiping the dir and restoring only our snapshot
            # would delete it. That is exactly the 2026-06 incident where a
            # refresh snapshot (taken before noaa/owid/fbi/bea were pushed)
            # clobbered all 4 providers. Overlay updates the files we
            # regenerated and leaves every other provider's data intact.
            cp -r "$tmp/data/." public/data/
            # The source-YAML dirs are owned solely by this workflow's
            # pipelines (inline emission, overwrite-always), so replacing
            # them wholesale is safe — no other job adds files to them.
            for dir in eia_state_energy; do
              if [ -d "$tmp/src/content/sources/$dir" ]; then
                rm -rf "src/content/sources/$dir"
                cp -r "$tmp/src/content/sources/$dir" "src/content/sources/"
              fi
            done
            rm -rf "$tmp"
            # source_index.json + generators-index.json are cross-provider
            # aggregates — rebuild from the merged tree so a provider added by
            # another job during this run stays indexed (its data files are
            # present from the reset; the overlay didn't remove them).
            python pipelines/build_summaries.py
            python pipelines/_generate_generators_index.py
            git add public/data/ public/generators-index.json
            for dir in eia_state_energy; do
              git add "src/content/sources/$dir/" 2>/dev/null || true
            done
            if git diff --cached --quiet; then
              echo "No data changes to commit (attempt $attempt)."
              exit 0
            fi
            git commit -m "chore: weekly market-data refresh"
            if git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push lost a race on attempt $attempt; refetching and retrying"
            sleep 5
          done
          echo "Failed to push after 5 attempts." >&2
          exit 1

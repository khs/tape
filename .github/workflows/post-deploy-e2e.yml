name: Post-deploy e2e (Playwright)

# Browser-level companion to post-deploy-smoke.yml. The smoke test curls
# HTML; this suite drives a real Chromium against the production deploy:
# dialogs open + center, the map "Full screen" toggle actually fills the
# viewport, the composer's source picker returns results, embeds render
# an SVG, /custom soft-404s.
#
# Born from the map-dialog regression (8d12c8ae36): 100% of that dialog's
# CSS shipped dead (Astro scoping vs. JS-created nodes) and no HTML-level
# check could see it — the page markup was byte-for-byte plausible. Only
# a real browser computing real layout catches that class of bug.
#
# Read-only by design: anonymous browsing only — no sign-in, no saves,
# no alert creation. Safe to point at production on every deploy.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Site URL to test (default: production)"
        required: false
        # Same PROD_URL note as post-deploy-smoke.yml: the Vercel project
        # rename to "tape" never landed (May 2026) — do NOT switch to
        # tape.vercel.app until the Vercel project itself is renamed.
        default: "https://legible-markets.vercel.app"

permissions:
  contents: read

jobs:
  e2e:
    # Mirror the smoke test's filter: production deploys that succeeded.
    # Preview deploys sit behind Vercel SSO, so a runner can't reach them.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve URL to test
        id: url
        run: |
          # See the PROD_URL comment in post-deploy-smoke.yml — prod is
          # still served from legible-markets.vercel.app.
          PROD_URL="https://legible-markets.vercel.app"
          URL="${{ github.event.inputs.url }}"
          if [ -z "$URL" ]; then URL="$PROD_URL"; fi
          URL="${URL%/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "E2E target: $URL"

      - name: Run Playwright suite
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.url.outputs.url }}
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

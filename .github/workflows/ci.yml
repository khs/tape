name: CI

# Cheap insurance against shipping a broken main. Runs on every PR and every
# push to main, so a typo, a missing import, a content-collection schema
# mismatch, or a TypeScript error gets caught before Vercel tries to deploy
# it (or worse, before a manual merge lands a half-broken commit).
#
# What this catches:
#   - `astro check` runs TypeScript across all .ts/.astro files, including
#     the content-collection schema validation against every YAML manifest.
#     This is how the "Entry sources/X not found" type of bug shows up.
#   - `astro build` is the closest thing to "did Vercel's build succeed?"
#     without paying for Vercel build minutes on every PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 20 leaves headroom for npm ci + the build + Python tests. (The
    # minutes-long source-data deep audit that originally forced 10→20
    # now runs weekly in weekly-safety.yml, not on every push; the
    # headroom is cheap to keep as a backstop.)
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Match the version Vercel pins serverless functions to so we're
          # not green here and red there.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` is the deterministic install — fails fast if package-lock.json
        # is out of sync with package.json, which would otherwise produce a
        # mystery-broken build.
        run: npm ci

      - name: Type-check (astro check)
        run: npx astro check

      - name: Unit tests (vitest)
        # Runs every .test.ts under src/lib/ and tests/. Covers the pure-TS
        # library code: composer state encode/decode, delta math, derive ops,
        # formatting, analytics packing. Astro components themselves aren't
        # tested here — they'd need a heavier setup and the lib tests catch
        # most of the semantic regressions.
        run: npm test

      - name: Set up Python
        # Needed for the pipeline-side unit tests below. The data-refresh
        # workflows install pandas/yfinance/etc., but the pipeline unit tests
        # only need pyyaml + stdlib — keep this install tiny so it doesn't
        # add minutes to PR CI.
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pipeline test deps
        # pyyaml for the source-corpus / coverage tests; python-dotenv
        # because test_census_acs_cd imports census_acs_cd, which imports
        # _env at module load, which does a hard `from dotenv import …`.
        # Both are tiny pure-Python wheels — negligible CI time.
        run: python -m pip install pyyaml python-dotenv hypothesis

      - name: Pipeline unit tests (unittest)
        # Every pipelines/test_*.py runs here. We ENUMERATE rather than
        # `unittest discover` because pipelines/ is a PEP-420 namespace
        # package (no __init__.py), which discover refuses as a start dir;
        # adding __init__.py would perturb the pipelines' own
        # `from common import …` import model. So: when you add a new
        # pipelines/test_*.py, ADD IT TO THIS LIST or it silently never
        # runs in CI (the orphan class this list was audited to close,
        # 2026-06-18 — six modules existed untracked).
        # Highlights: test_common locks write_timeseries merge-on-write +
        # the cached_get TTL; test_about_page_coverage catches "new
        # provider, stale /about/"; test_audit_source_scales locks the
        # value-magnitude heuristic; test_treasury_tic / test_cdc_health
        # guard the two parse-heaviest pipelines.
        run: |
          python -m unittest pipelines.test_generators_index -v
          python -m unittest pipelines.test_common -v
          python -m unittest pipelines.test_about_page_coverage -v
          python -m unittest pipelines.test_welcome_page_coverage -v
          python -m unittest pipelines.test_audit_source_scales -v
          python -m unittest pipelines.test_usaspending_annualize -v
          python -m unittest pipelines.test_build_state_tract_topo -v
          python -m unittest pipelines.test_treasury_tic -v
          python -m unittest pipelines.test_cdc_health -v
          python -m unittest pipelines.test_source_corpus -v
          python -m unittest pipelines.test_cache -v
          python -m unittest pipelines.test_check_alerts -v
          python -m unittest pipelines.test_bea -v
          python -m unittest pipelines.test_census_acs_cd -v
          python -m unittest pipelines.test_dispatch_alert_emails -v
          python -m unittest pipelines.test_merge_points_fuzz -v
          python -m unittest pipelines.test_census_acs_choropleth -v
          python -m unittest pipelines.test_fred_catalog -v
          python -m unittest pipelines.test_ci_test_coverage -v

      - name: Summary-parity fixture is in sync
        # The cross-language summary gate (src/lib/summary-parity.test.ts, run in
        # `npm test`) checks TS computeSummaryFromPoints against this Python-
        # generated fixture. Regenerate it from the REAL build_summaries.py and
        # fail if it drifts: that means the Python prior/spark math changed
        # without re-emitting, so the TS test would be validating stale output.
        # The TS half catches the reverse (TS drifting from the fixture).
        run: |
          python pipelines/emit_summary_parity_fixture.py
          git diff --exit-code -- src/lib/__fixtures__/summary-parity.json

      # The minutes-long `audit --full` deep scan of UNREFERENCED sources
      # moved to .github/workflows/weekly-safety.yml. It was report-only
      # (only ::warning:: annotations), so it never gated anything. The
      # checks that DO protect a live deploy, referenced sources with too
      # little data to render, still hard-fail inside the prebuild of
      # `npm run build` below on every push, as does the quarantine of
      # broken-data sources.

      - name: Build
        # SITE_URL is unset here, so Astro.site is undefined and sitemap()
        # warns + skips — that's fine for CI. The real build on Vercel
        # picks up VERCEL_PROJECT_PRODUCTION_URL and emits the sitemap.
        run: npm run build

      - name: No build-drift in generated files
        # The prebuild (gen-source-count.mjs + audit-source-data.mjs) regenerates
        # these two from the source corpus. If the committed copies are stale —
        # e.g. a source YAML was added or removed without re-running the build —
        # the Build step above rewrites them and they drift here. Fail so the
        # regenerated output gets committed instead of silently diverging from the
        # corpus. Both are deterministic (counts / id-map, no timestamps).
        run: git diff --exit-code -- src/lib/source-count.ts src/lib/quarantined-sources.json

name: CI

# Cheap insurance against shipping a broken main. Runs on every PR and every
# push to main, so a typo, a missing import, a content-collection schema
# mismatch, or a TypeScript error gets caught before Vercel tries to deploy
# it (or worse, before a manual merge lands a half-broken commit).
#
# What this catches:
#   - `astro check` runs TypeScript across all .ts/.astro files, including
#     the content-collection schema validation against every YAML manifest.
#     This is how the "Entry sources/X not found" type of bug shows up.
#   - `astro build` is the closest thing to "did Vercel's build succeed?"
#     without paying for Vercel build minutes on every PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 10 → 20 when the source-data deep audit landed (it JSON-parses
    # every data file, which costs a few minutes on top of the build).
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Match the version Vercel pins serverless functions to so we're
          # not green here and red there.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` is the deterministic install — fails fast if package-lock.json
        # is out of sync with package.json, which would otherwise produce a
        # mystery-broken build.
        run: npm ci

      - name: Type-check (astro check)
        run: npx astro check

      - name: Unit tests (vitest)
        # Runs every .test.ts under src/lib/ and tests/. Covers the pure-TS
        # library code: composer state encode/decode, delta math, derive ops,
        # formatting, analytics packing. Astro components themselves aren't
        # tested here — they'd need a heavier setup and the lib tests catch
        # most of the semantic regressions.
        run: npm test

      - name: Set up Python
        # Needed for the pipeline-side unit tests below. The data-refresh
        # workflows install pandas/yfinance/etc., but the pipeline unit tests
        # only need pyyaml + stdlib — keep this install tiny so it doesn't
        # add minutes to PR CI.
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pipeline test deps
        run: python -m pip install pyyaml

      - name: Pipeline unit tests (unittest)
        # Three test modules:
        #   - test_generators_index.py: guards the country-label /
        #     multi-word-slug / template-leak logic in
        #     _generate_generators_index.py. Pre-fix bugs that shipped
        #     to prod: "Uk"/"Uae" capitalization, "kong"/"rica"
        #     truncated slugs, "Sub-Saharan Africa" leaking as a
        #     template label. Also audits the checked-in
        #     generators-index.json.
        #   - test_common.py: locks down the merge-on-write semantics
        #     in write_timeseries / write_curve and the TTL cache in
        #     cached_get. Without these tests it would be easy to
        #     silently regress to "overwrite, drop history" in a
        #     future common.py edit.
        #   - test_about_page_coverage.py: catches "new data provider
        #     added but About page not updated" — the staleness class
        #     fixed in commit 1bad93460a (when 7 of 17 providers were
        #     silently missing from /about/ for months).
        run: |
          python -m unittest pipelines.test_generators_index -v
          python -m unittest pipelines.test_common -v
          python -m unittest pipelines.test_about_page_coverage -v
          python -m unittest pipelines.test_welcome_page_coverage -v
          python -m unittest pipelines.test_audit_source_scales -v

      - name: Source-data deep audit (--full)
        # Order + summary-drift + point-count checks across EVERY
        # source's data file, not just chart-referenced ones. Catches
        # the bea/personal_income_virginia class (points concatenated
        # out of order → a stale "latest" served as live) and the
        # usaspending/metro_* orphan class anywhere in the catalog.
        # Referenced-source violations hard-fail inside the prebuild
        # (npm run build below); unreferenced ones surface here as
        # ::warning:: annotations — they're already auto-hidden from
        # the pickers by the prebuild's quarantine pass.
        run: node scripts/audit-source-data.mjs --full

      - name: Build
        # SITE_URL is unset here, so Astro.site is undefined and sitemap()
        # warns + skips — that's fine for CI. The real build on Vercel
        # picks up VERCEL_PROJECT_PRODUCTION_URL and emits the sitemap.
        run: npm run build
